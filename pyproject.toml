[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
pythonpath = ["..", "."]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-book-tools"
version = "0.1.0"
description = "Recipe Book Build Tools"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
advanced = [
    "numpy>=1.18.5",
    "scipy>=1.9.0",
    "nltk>=3.8.1",
    "spacy>=3.7.2",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "bottleneck>=1.3.6",
    "sentence-transformers>=2.2.0",
    "pyenchant>=3.2.0",
] 